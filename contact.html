<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Scarabyte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Caveat:wght@600;700&family=Nunito:wght@300;400;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* Design tokens (shared with the home page) */
:root {
  --bg:           oklch(1.000 0.000   0);
  --surface:      oklch(0.974 0.009 232);
  --surface-2:    oklch(0.952 0.016 232);
  --border:       oklch(0.912 0.013 232);
  --border-med:   oklch(0.855 0.022 232);

  --primary:      oklch(0.192 0.090 232);
  --primary-mid:  oklch(0.370 0.090 232);
  --primary-pale: oklch(0.942 0.022 232);

  --accent:       #E0A82E;
  --accent-light: oklch(0.945 0.045 85);
  --accent-dark:  oklch(0.520 0.115 72);

  --ink:          oklch(0.118 0.028 232);
  --muted:        oklch(0.462 0.020 232);
  --faint:        oklch(0.640 0.012 232);

  --font-d: 'Bricolage Grotesque', system-ui, sans-serif;
  --font-b: 'Nunito', system-ui, sans-serif;

  --r-sm:   8px;
  --r-md:   16px;
  --r-lg:   24px;
  --r-xl:   32px;
  --r-pill: 9999px;

  --nav-bg:    oklch(1.000 0.000 0 / 0.88);
  --footer-bg: var(--primary);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-b);
  line-height: 1.65;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes barakaRise { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes barakaBob  { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(5px); } }

/* ── Top bar (shown on every page except the home splash) ── */
.nav {
  position: fixed;
  inset-block-start: 0;
  inset-inline: 0;
  z-index: 60;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1rem 2.5rem;
  background: var(--nav-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  animation: fadeIn 0.55s ease-out 0.1s backwards;
}
.nav-logo {
  display: flex;
  align-items: center;
  gap: 0.825rem;
  text-decoration: none;
  color: var(--primary);
}
.nav-logo-img { width: 42px; height: auto; display: block; }
.nav-wordmark {
  font-family: 'Rajdhani', var(--font-d);
  font-weight: 700;
  font-size: 1.18rem;
  letter-spacing: 0.005em;
  line-height: 1;
  color: var(--primary);
  white-space: nowrap;
}

/* ── Hand-drawn doodle cue ── */
.doodle { user-select: none; -webkit-user-select: none; }
.doodle-word {
  font-family: 'Caveat', var(--font-b);
  font-weight: 700;
  letter-spacing: 0.01em;
  line-height: 0.9;
  display: block;
}
.doodle-arrow path {
  fill: none;
  stroke: currentColor;
  stroke-width: 6;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.footer-doodle {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 0.4rem;
  color: var(--primary);
}
.footer-doodle .doodle-word { font-size: 2rem; transform: rotate(-5deg) translateY(-9px); }
.footer-doodle .doodle-arrow-r { width: 74px; height: auto; }

/* ── Contact page body ── */
.contact-main {
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  background: var(--surface);
  padding: 7rem 1.5rem 8rem;        /* clear the fixed nav + dock */
  overflow: hidden;
}
.contact-block {
  position: relative;
  z-index: 1;
  text-align: center;
  max-width: 640px;
  animation: fadeIn 0.6s ease-out 0.2s backwards;
}
.contact-title {
  font-family: 'Rajdhani', var(--font-d);
  font-weight: 700;
  font-size: clamp(2rem, 6vw, 3.4rem);
  letter-spacing: 0.04em;
  line-height: 1.05;
  color: var(--primary);
}
.contact-lead {
  margin-top: 0.6rem;
  color: var(--muted);
  font-size: 1.05rem;
}
.contact-inner {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  margin-top: 2.3rem;
}
.footer-email {
  display: inline-block;
  text-decoration: none;
  background: #fff;
  border: 1.8px solid oklch(0.855 0.022 232);
  border-radius: 13px;
  padding: 0.8rem 1.4rem;
  color: oklch(0.255 0.060 232);
  font-weight: 700;
  font-size: 1.2rem;
  box-shadow: 0 10px 26px oklch(0.192 0.090 232 / 0.16);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.footer-email .em-user { color: #C8901C; }
.footer-email:hover { transform: translateY(-1px); box-shadow: 0 5px 16px oklch(0.192 0.090 232 / 0.45); }

/* Baraka peeks up from the bottom-right, just above the footer line */
.baraka-peek {
  position: absolute;
  right: clamp(1.5rem, 5vw, 5rem);
  bottom: 0;
  width: 138px;
  height: 92px;
  overflow: hidden;
  pointer-events: none;
  user-select: none;
  z-index: 1;
}
.baraka-peek img {
  width: 100%;
  height: auto;
  display: block;
  filter: drop-shadow(0 6px 14px oklch(0.192 0.090 232 / 0.18));
  animation: barakaRise 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.4s backwards,
             barakaBob 4.5s ease-in-out 1.1s infinite;
}

/* ── Footer ── */
footer {
  background: var(--footer-bg);
  padding: 3rem 2.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 1.5rem;
  position: relative;
}
.footer-logo { display: flex; align-items: center; gap: 0.5rem; text-decoration: none; }
.footer-logo-img { width: 26px; height: auto; display: block; opacity: 0.75; }
.footer-name {
  font-family: 'Rajdhani', var(--font-d);
  font-weight: 700;
  font-size: 0.92rem;
  letter-spacing: 0.01em;
  line-height: 1;
  color: #fff;
  opacity: 0.85;
}
.footer-copy { font-size: 0.72rem; color: oklch(0.555 0.035 232); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-delay: 0ms !important;
    transition-duration: 0.001ms !important;
  }
}
@media (max-width: 680px) {
  .nav { padding: 0.85rem 1.25rem; }
  footer { flex-direction: column; text-align: center; gap: 0.6rem; }
}
@media (max-width: 480px) {
  /* The doodle + email won't fit side by side on a phone — drop the
     decorative "contact" scribble and centre the email on its own. */
  .contact-inner .footer-doodle { display: none; }
  .contact-inner { gap: 0; margin-top: 1.8rem; }
  .footer-email { font-size: 1.1rem; }
}
</style>

<link rel="stylesheet" href="dock.css">
</head>

<body>

<nav class="nav">
  <a href="index.html" class="nav-logo" aria-label="Scarabyte home">
    <img class="nav-logo-img" src="assets/scarab-normal.png" alt="" aria-hidden="true">
    <span class="nav-wordmark">ScaraByte</span>
  </a>
</nav>

<main class="contact-main">
  <div class="contact-block">
    <h1 class="contact-title">Get in touch</h1>
    <p class="contact-lead">Questions, ideas, or just want to say hi? Drop us a line.</p>
    <div class="contact-inner">
      <div class="footer-doodle doodle" aria-hidden="true">
        <span class="doodle-word">contact</span>
        <svg class="doodle-arrow doodle-arrow-r" viewBox="0 0 100 44" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 20 C28 31 54 32 76 28 C84 26 90 23 96 22"/>
          <g transform="rotate(-15 96 22)">
            <path d="M84 16 C88 18 92 20 96 22"/>
            <path d="M84 28 C88 26 92 24 96 22"/>
          </g>
        </svg>
      </div>
      <a href="mailto:hello@scarabyte.app" class="footer-email"><span class="em-user">hello</span>@scarabyte.app</a>
    </div>
  </div>

  <div class="baraka-peek" aria-hidden="true">
    <img src="assets/baraka-noarms.svg" alt="">
  </div>
</main>

<footer>
  <a href="index.html" class="footer-logo" aria-label="Scarabyte home">
    <img class="footer-logo-img" src="assets/scarab-white.png" alt="" aria-hidden="true">
    <span class="footer-name">ScaraByte</span>
  </a>
  <span class="footer-copy">© 2026 Scarabyte</span>
</footer>
