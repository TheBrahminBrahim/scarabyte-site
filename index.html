<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scarabyte — Software for the analog life</title>
  <meta name="description" content="Scarabyte builds software for the analog life — small, deliberate apps that connect you back to the physical world." />
  <meta property="og:title" content="Scarabyte" />
  <meta property="og:description" content="We build software for the analog life." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://scarabyte.app" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <style>
    :root {
      --bg: #FFFFFF;
      --ink: #051C35;
      --ink-soft: #4A586B;
      --rule: #E5E1D8;
      --card: #FFFFFF;
      --shadow: 0 1px 2px rgba(5, 28, 53, 0.04), 0 8px 24px rgba(5, 28, 53, 0.06);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.55;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 24px 48px;
      max-width: 720px;
      margin: 0 auto;
      width: 100%;
    }
    .logo {
      width: 240px;
      max-width: 60%;
      height: auto;
      margin-bottom: 28px;
      user-select: none;
    }
    .tagline {
      font-size: 22px;
      font-weight: 500;
      letter-spacing: -0.01em;
      text-align: center;
      margin: 0 0 56px;
      color: var(--ink);
    }
    .apps {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-bottom: 48px;
    }
    .app-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 20px;
      background: var(--card);
      border: 1px solid var(--rule);
      border-radius: 14px;
      text-decoration: none;
      color: var(--ink);
      transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
    }
    .app-card:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow);
      border-color: #D5CFC2;
    }
    .app-card .name {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin: 0 0 2px;
    }
    .app-card .desc {
      font-size: 14px;
      color: var(--ink-soft);
      margin: 0;
    }
    .app-card .arrow {
      margin-left: auto;
      color: var(--ink-soft);
      font-size: 18px;
      line-height: 1;
    }
    .app-card .glyph {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border-radius: 9px;
      background: var(--ink);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.04em;
    }
    .contact {
      font-size: 15px;
      color: var(--ink-soft);
      text-align: center;
      margin: 0;
    }
    .contact a {
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 1px;
    }
    .contact a:hover { border-bottom-color: var(--ink); }
    footer {
      text-align: center;
      padding: 24px;
      font-size: 13px;
      color: var(--ink-soft);
      border-top: 1px solid var(--rule);
    }
    @media (max-width: 480px) {
      main { padding: 48px 20px 32px; }
      .logo { width: 200px; }
      .tagline { font-size: 19px; margin-bottom: 40px; }
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/logo.svg" alt="Scarabyte" />
    <p class="tagline">We build software for the analog life.</p>

    <section class="apps" aria-label="Our apps">
      <a class="app-card" href="https://screenreps.app">
        <div class="glyph" aria-hidden="true">SR</div>
        <div>
          <p class="name">ScreenReps</p>
          <p class="desc">Earn screen time with exercise.</p>
        </div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </section>

    <p class="contact">
      Say hello: <a href="mailto:hello@scarabyte.app">hello@scarabyte.app</a>
    </p>
  </main>

  <footer>© 2026 Scarabyte</footer>
</body>
</html>
